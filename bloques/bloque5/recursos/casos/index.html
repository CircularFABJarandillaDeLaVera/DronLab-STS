<!doctype html>
<html lang="es" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Casos Bloque 5 STS - DronLab</title>
  <style>
    *{box-sizing:border-box}.page{max-width:1080px;margin:auto;padding:22px;width:100%}.card{background:var(--cf-color-surface);border:1px solid var(--cf-color-border);border-radius:16px;padding:22px;margin-bottom:16px;box-shadow:var(--cf-shadow-sm);overflow-wrap:anywhere}.case{border-left:6px solid #ffd43b}.meta{display:flex;gap:8px;flex-wrap:wrap}.tag{padding:6px 9px;border-radius:999px;background:#e8f5f1;color:#087157;font-weight:900;font-size:12px;text-transform:uppercase}html[data-theme="dark"] .tag{background:var(--cf-color-accent-soft);color:var(--cf-color-text)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}h1,h2{margin-top:0}li{margin:5px 0}@media(max-width:800px){.grid{grid-template-columns:1fr}.page{padding:16px}}@media print{.doc-topbar{display:none}.card{box-shadow:none;break-inside:avoid}}
  </style>
  <link rel="stylesheet" href="../../../../assets/edusdk-design-system/tokens/tokens.css">
  <link rel="stylesheet" href="../../../../assets/edusdk-design-system/tokens/semantic-tokens.css">
  <link rel="stylesheet" href="../../../../assets/edusdk-design-system/components/components.css">
  <link rel="stylesheet" href="../../../../assets/common/a2-edusdk-theme.css">
  <link rel="stylesheet" href="../../../../assets/css/bloque-shared.css">
  <link rel="stylesheet" href="../../../../assets/css/bloque-theme.css">
  <script src="../../../../assets/js/theme-toggle.js" defer></script>
</head>
<body class="block-page">
  <div class="doc-page">
  <header class="brand cf-topbar cf-topbar--course block-topbar doc-topbar">
    <a class="block-brand" href="../index.html" aria-label="Recursos del Bloque 5">
      <img src="../../../../assets/branding/logo-circular-fab.png" alt="Circular FAB">
      <span><b>Circular FAB · DronLab</b><span>Casos prácticos · Bloque 5</span></span>
    </a>
    <button class="cf-button cf-button--secondary theme-toggle" type="button" data-theme-toggle aria-label="Activar modo oscuro" aria-pressed="false"><span data-theme-icon aria-hidden="true">&#9790;</span><span data-theme-label>Modo oscuro</span></button>
  </header>
  <main id="main" class="page"></main>
  <footer class="corp-band" aria-label="Entidades colaboradoras">
    <img class="corp-band__logo corp-band__logo--wide corp-logo--light" src="../../../../assets/edusdk-design-system/brand/Logos_CFAB_2026_con-Ministerio.png" alt="Logotipos institucionales de Circular FAB">
    <img class="corp-band__logo corp-band__logo--wide corp-logo--dark" src="../../../../assets/edusdk-design-system/brand/Logos_CFAB_2026_con-Ministerio_blanco.png" alt="Logotipos institucionales de Circular FAB">
  </footer>
  </div>
  <script>
    const list=a=>`<ul>${(a||[]).map(x=>`<li>${x}</li>`).join('')}</ul>`;
    fetch('casos.json').then(r=>r.json()).then(casos=>{
      const d=Array.isArray(casos)?{titulo:'Casos practicos Bloque 5',total:casos.length,casos}:casos;
      document.getElementById('main').innerHTML=`<section class="block-hero block-hero--compact"><h1>${d.titulo}</h1><p>${d.total} casos sin solucion para resolver con el profesor. Syllabus STS paginas 7-8 | Estado VALIDADO.</p></section>`+d.casos.map(c=>`<section class="card case"><div class="meta"><span class="tag">${c.id}</span><span class="tag">${c.dificultad}</span></div><h2>${c.titulo}</h2><p><b>Contexto:</b> ${c.contexto}</p><p><b>Situacion inicial:</b> ${c.situacion_inicial}</p><p><b>Problema:</b> ${c.problema_planteado}</p><div class="grid"><article><h3>Informacion disponible</h3>${list(c.informacion_disponible)}</article><article><h3>Preguntas para el alumno</h3>${list(c.preguntas_para_el_alumno)}</article><article><h3>Objetivos de aprendizaje</h3>${list(c.objetivos_de_aprendizaje)}</article><article><h3>Errores habituales</h3>${list(c.errores_habituales)}</article></div><p><b>Conceptos:</b> ${(c.conceptos_relacionados||[]).join(' | ')}</p><p><b>Referencia:</b> ${c.referencia_al_bloque}</p></section>`).join('');
    }).catch(()=>{document.getElementById('main').innerHTML='<section class="card cf-card cf-card--interactive">No se pudieron cargar los casos. Abre esta vista desde Live Server.</section>';});
  </script>
</body>
</html>
