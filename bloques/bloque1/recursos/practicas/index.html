<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Practicas Bloque 1 STS - DronLab</title>
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#eef4f7;color:#10243a}header{background:#07192f;color:#fff;padding:14px 22px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}header img{width:42px;object-fit:contain;filter:drop-shadow(0 4px 8px rgba(0,0,0,.18))}header a{margin-left:auto;color:#fff;text-decoration:none}.page{max-width:1080px;margin:auto;padding:22px}.hero{background:linear-gradient(135deg,#07192f,#0d4564);color:#fff}.card{background:#fff;border-radius:16px;padding:22px;margin-bottom:16px;box-shadow:0 8px 22px #17364d12;overflow-wrap:anywhere}.practice{border-left:6px solid #16a47d}.meta{display:flex;gap:8px;flex-wrap:wrap}.tag{padding:6px 9px;border-radius:999px;background:#e8f5f1;color:#087157;font-weight:900;font-size:12px;text-transform:uppercase}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.steps{counter-reset:step;list-style:none;padding:0}.steps li{counter-increment:step;margin:8px 0;padding:10px 10px 10px 42px;border:1px solid #d8e2e8;border-radius:10px;background:#f8fbfd;position:relative}.steps li:before{content:counter(step);position:absolute;left:10px;top:10px;width:22px;height:22px;border-radius:50%;background:#07192f;color:#fff;display:grid;place-items:center;font-size:12px;font-weight:900}h1,h2{margin-top:0}li{margin:5px 0}@media(max-width:800px){.grid{grid-template-columns:1fr}header a{margin-left:0}.page{padding:16px}}@media print{header{display:none}.card{box-shadow:none;break-inside:avoid}}
  </style>
</head>
<body>
  <header><img src="../../../../assets/branding/logo-circular-fab.png" alt="Circular FAB"><div><b>DRONLAB STS - BLOQUE 1</b><br><span>Practicas guiadas</span></div><a href="../index.html">Recursos</a></header>
  <main id="main" class="page"></main>
  <script>
    const list=a=>`<ul>${(a||[]).map(x=>`<li>${x}</li>`).join('')}</ul>`;
    fetch('practicas.json').then(r=>r.json()).then(practicas=>{
      const d={titulo:'Practicas guiadas Bloque 1 STS',total:practicas.length,practicas};
      document.getElementById('main').innerHTML=`<section class="card hero"><h1>${d.titulo}</h1><p>${d.total} practicas guiadas para completar tareas, comprobar informacion y justificar decisiones. Syllabus STS paginas 3-4 · Estado VALIDADO.</p></section>`+d.practicas.map(p=>`<section class="card practice"><div class="meta"><span class="tag">${p.id}</span><span class="tag">${p.dificultad}</span><span class="tag">${p.tiempo_estimado}</span></div><h2>${p.titulo}</h2><p><b>Objetivo:</b> ${p.objetivo}</p><p><b>Contexto:</b> ${p.contexto}</p><h3>Instrucciones paso a paso</h3><ol class="steps">${p.instrucciones_paso_a_paso.map(x=>`<li>${x}</li>`).join('')}</ol><div class="grid"><article><h3>Material necesario</h3>${list(p.material_necesario)}</article><article><h3>Criterios de exito</h3>${list(p.criterios_de_exito)}</article><article><h3>Errores habituales</h3>${list(p.errores_habituales)}</article><article><h3>Conceptos relacionados</h3>${list(p.conceptos_relacionados)}</article></div><p><b>Referencia:</b> ${p.referencia_al_bloque}</p></section>`).join('');
    }).catch(()=>{document.getElementById('main').innerHTML='<section class="card">No se pudieron cargar las practicas. Abre esta vista desde Live Server.</section>';});
  </script>
</body>
</html>
