<!doctype html>
<html lang="es" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Practicas Bloque 4 STS - DronLab</title>
  <style>
    *{box-sizing:border-box}.page{max-width:1080px;margin:auto;padding:22px;width:100%}.card{background:var(--cf-color-surface);border:1px solid var(--cf-color-border);border-radius:16px;padding:22px;margin-bottom:16px;box-shadow:var(--cf-shadow-sm);overflow-wrap:anywhere}.practice{border-left:6px solid #16a47d}.meta{display:flex;gap:8px;flex-wrap:wrap}.tag{padding:6px 9px;border-radius:999px;background:#e8f5f1;color:#087157;font-weight:900;font-size:12px;text-transform:uppercase}html[data-theme="dark"] .tag{background:var(--cf-color-accent-soft);color:var(--cf-color-text)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.steps{counter-reset:step;list-style:none;padding:0}.steps li{counter-increment:step;margin:8px 0;padding:10px 10px 10px 42px;border:1px solid #d8e2e8;border-radius:10px;background:#f8fbfd;position:relative}html[data-theme="dark"] .steps li{background:var(--cf-color-surface-muted);border-color:var(--cf-color-border);color:var(--cf-color-text)}.steps li:before{content:counter(step);position:absolute;left:10px;top:10px;width:22px;height:22px;border-radius:50%;background:#07192f;color:#fff;display:grid;place-items:center;font-size:12px;font-weight:900}h1,h2{margin-top:0}li{margin:5px 0}@media(max-width:800px){.grid{grid-template-columns:1fr}.page{padding:16px}}@media print{.doc-topbar{display:none}.card{box-shadow:none;break-inside:avoid}}
  </style>
  <link rel="stylesheet" href="../../../../assets/edusdk-design-system/tokens/tokens.css">
  <link rel="stylesheet" href="../../../../assets/edusdk-design-system/tokens/semantic-tokens.css">
  <link rel="stylesheet" href="../../../../assets/edusdk-design-system/components/components.css">
  <link rel="stylesheet" href="../../../../assets/common/a2-edusdk-theme.css">
  <link rel="stylesheet" href="../../../../assets/css/bloque-shared.css">
  <link rel="stylesheet" href="../../../../assets/css/bloque-theme.css">
  <script src="../../../../assets/js/theme-toggle.js" defer></script>
</head>
<body class="block-page">
  <div class="doc-page">
  <header class="brand cf-topbar cf-topbar--course block-topbar doc-topbar">
    <a class="block-brand" href="../index.html" aria-label="Recursos del Bloque 4">
      <img src="../../../../assets/branding/logo-circular-fab.png" alt="Circular FAB">
      <span><b>Circular FAB · DronLab</b><span>Prácticas guiadas · Bloque 4</span></span>
    </a>
    <button class="cf-button cf-button--secondary theme-toggle" type="button" data-theme-toggle aria-label="Activar modo oscuro" aria-pressed="false"><span data-theme-icon aria-hidden="true">&#9790;</span><span data-theme-label>Modo oscuro</span></button>
  </header>
  <main id="main" class="page"></main>
  <footer class="corp-band" aria-label="Entidades colaboradoras">
    <img class="corp-band__logo corp-band__logo--wide corp-logo--light" src="../../../../assets/edusdk-design-system/brand/Logos_CFAB_2026_con-Ministerio.png" alt="Logotipos institucionales de Circular FAB">
    <img class="corp-band__logo corp-band__logo--wide corp-logo--dark" src="../../../../assets/edusdk-design-system/brand/Logos_CFAB_2026_con-Ministerio_blanco.png" alt="Logotipos institucionales de Circular FAB">
  </footer>
  </div>
  <script>
    const list=a=>`<ul>${(a||[]).map(x=>`<li>${x}</li>`).join('')}</ul>`;
    fetch('practicas.json').then(r=>r.json()).then(practicas=>{
      const d={titulo:'Practicas guiadas Bloque 4 STS',total:practicas.length,practicas};
      document.getElementById('main').innerHTML=`<section class="block-hero block-hero--compact"><h1>${d.titulo}</h1><p>${d.total} practicas guiadas para completar tareas, comprobar informacion y justificar decisiones. Syllabus STS paginas 6-7 · Estado VALIDADO.</p></section>`+d.practicas.map(p=>`<section class="card practice"><div class="meta"><span class="tag">${p.id}</span><span class="tag">${p.dificultad}</span><span class="tag">${p.tiempo_estimado}</span></div><h2>${p.titulo}</h2><p><b>Objetivo:</b> ${p.objetivo}</p><p><b>Contexto:</b> ${p.contexto}</p><h3>Instrucciones paso a paso</h3><ol class="steps">${p.instrucciones_paso_a_paso.map(x=>`<li>${x}</li>`).join('')}</ol><div class="grid"><article><h3>Material necesario</h3>${list(p.material_necesario)}</article><article><h3>Criterios de exito</h3>${list(p.criterios_de_exito)}</article><article><h3>Errores habituales</h3>${list(p.errores_habituales)}</article><article><h3>Conceptos relacionados</h3>${list(p.conceptos_relacionados)}</article></div><p><b>Referencia:</b> ${p.referencia_al_bloque}</p></section>`).join('');
    }).catch(()=>{document.getElementById('main').innerHTML='<section class="card cf-card cf-card--interactive">No se pudieron cargar las practicas. Abre esta vista desde Live Server.</section>';});
  </script>
</body>
</html>
